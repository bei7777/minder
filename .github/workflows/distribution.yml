name: Local package distribution
on:
  workflow_dispatch:
    inputs:
      pi_repository:
        description: Pi workspace repository (owner/name)
        required: true
      pi_ref:
        description: Pi workspace commit SHA
        required: true
      dsh_repository:
        description: DSH workspace repository (owner/name)
        required: true
      dsh_ref:
        description: DSH workspace commit SHA
        required: true
permissions:
  contents: read
jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: minder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pi_repository }}
          ref: ${{ inputs.pi_ref }}
          path: pi-minder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.dsh_repository }}
          ref: ${{ inputs.dsh_ref }}
          path: dsh-plugin-minder
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - run: pnpm install --frozen-lockfile
        working-directory: pi-minder
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-plugin-minder
      - run: pnpm install --frozen-lockfile
        working-directory: minder
      - name: Build changed packages and verify original 0.1.4 archives
        run: bash tests/distribution/build-candidate.sh
        id: pack
        working-directory: minder
      - run: pnpm test
        working-directory: pi-minder
      - run: pnpm test
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        working-directory: minder
      - run: pnpm lab verify-release
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        working-directory: minder
      - run: pnpm lab test-hosts
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        working-directory: minder
      - run: pnpm lab test-kit
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        working-directory: minder
      - run: pnpm lab test-upgrade .minder-dev/upgrade-base/delivery/release.json
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        working-directory: minder

  wsl:
    name: WSL2 / Linux and Windows volumes
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: minder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pi_repository }}
          ref: ${{ inputs.pi_ref }}
          path: pi-minder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.dsh_repository }}
          ref: ${{ inputs.dsh_ref }}
          path: dsh-plugin-minder
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Debian-12
          wsl-version: 2
          wsl-shell-user: root
          additional-packages: ca-certificates curl git xz-utils
      - name: Exercise published tarballs and verify both filesystem types
        shell: wsl-bash {0}
        run: bash minder/tests/distribution/wsl.sh
