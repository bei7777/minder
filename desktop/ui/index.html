<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Minder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg aria-hidden="true" class="icon-library" xmlns="http://www.w3.org/2000/svg">
    <symbol id="mark" viewBox="0 0 32 32">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="#2c4f41"/>
      <path d="M7.2 23.4V9.7h2.6l6.2 8.5 6.2-8.5h2.6v13.7h-3V15l-5.8 7.7-5.8-7.7v8.4z" fill="#f7f1d8"/>
      <circle cx="24.5" cy="7.7" r="1.45" fill="#e4b765"/>
    </symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M7 4.5h10a3.5 3.5 0 0 1 3.5 3.5v6.3a3.5 3.5 0 0 1-3.5 3.5h-6.2l-4.9 3v-3.2a3.5 3.5 0 0 1-2.4-3.3V8A3.5 3.5 0 0 1 7 4.5Z"/><path d="M8 9.4h8M8 13h5.1"/></symbol>
    <symbol id="icon-tasks" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="16" rx="3"/><path d="M8.5 3v3m7-3v3m-7.4 7.6 2.2 2.1 5-5.1"/></symbol>
    <symbol id="icon-files" viewBox="0 0 24 24"><path d="M6 2.8h8l4.8 4.9v12.1a1.4 1.4 0 0 1-1.4 1.4H6a1.4 1.4 0 0 1-1.4-1.4V4.2A1.4 1.4 0 0 1 6 2.8Z"/><path d="M14 3v4.8h4.7M8 12h7.4M8 15.7h5"/></symbol>
    <symbol id="icon-memory" viewBox="0 0 24 24"><path d="M12 6.5c-2.2-2.2-5.3-2.6-8.7-2v13.2c3.4-.6 6.5-.1 8.7 2.1 2.2-2.2 5.3-2.7 8.7-2.1V4.5c-3.4-.6-6.5-.2-8.7 2Zm0 0v13"/></symbol>
    <symbol id="icon-inbox" viewBox="0 0 24 24"><path d="M5.3 16.4h13.4c-1.6-1.7-1.8-3.3-1.8-6.4a4.9 4.9 0 0 0-9.8 0c0 3.1-.2 4.7-1.8 6.4Z"/><path d="M10 19.1a2.2 2.2 0 0 0 4 0M12 3.1v1.7"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M3.8 6.1H13m3.8 0h3.4M3.8 12h3.6m3.8 0h9M3.8 17.9h9.4m3.8 0h3.2"/><circle cx="14.9" cy="6.1" r="1.9"/><circle cx="9.3" cy="12" r="1.9"/><circle cx="15.1" cy="17.9" r="1.9"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3.5 7.5V6.1c0-.8.6-1.4 1.4-1.4h5l2.4 2.8h6.8c.8 0 1.4.6 1.4 1.4v8.8c0 .9-.7 1.6-1.6 1.6H5.1c-.9 0-1.6-.7-1.6-1.6Z"/></symbol>
    <symbol id="icon-sidebar" viewBox="0 0 24 24"><rect x="3" y="4.4" width="18" height="15.2" rx="2.4"/><path d="M9.3 4.6v14.8"/></symbol>
  </svg>
  <aside id="sidebar" aria-label="Minder 导航">
    <div class="mac-drag-space" aria-hidden="true"></div>
    <div class="brand">
      <svg aria-hidden="true" class="brand-mark"><use href="#mark"/></svg>
      <span>Minder</span>
    </div>
    <nav aria-label="工作台">
      <button type="button" data-page="chat" title="对话 (⌘1)" aria-keyshortcuts="Meta+1">
        <svg class="icon" aria-hidden="true"><use href="#icon-chat"/></svg><span>对话</span><kbd aria-hidden="true">⌘1</kbd>
      </button>
      <button type="button" data-page="tasks" title="委托 (⌘6)" aria-keyshortcuts="Meta+6">
        <svg class="icon" aria-hidden="true"><use href="#icon-tasks"/></svg><span>委托</span><kbd aria-hidden="true">⌘6</kbd>
      </button>
      <div class="nav-section" aria-hidden="true">工作记录</div>
      <button type="button" data-page="files" title="文件记录 (⌘2)" aria-keyshortcuts="Meta+2">
        <svg class="icon" aria-hidden="true"><use href="#icon-files"/></svg><span>文件记录</span><kbd aria-hidden="true">⌘2</kbd>
      </button>
      <button type="button" data-page="memory" title="记忆审阅 (⌘3)" aria-keyshortcuts="Meta+3">
        <svg class="icon" aria-hidden="true"><use href="#icon-memory"/></svg><span>记忆审阅</span><kbd aria-hidden="true">⌘3</kbd>
      </button>
      <button type="button" data-page="inbox" title="提醒 (⌘4)" aria-keyshortcuts="Meta+4">
        <svg class="icon" aria-hidden="true"><use href="#icon-inbox"/></svg><span>提醒</span><output id="inbox-count" aria-hidden="true" hidden></output><kbd aria-hidden="true">⌘4</kbd>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <button type="button" data-page="settings" title="设置 (⌘5)" aria-keyshortcuts="Meta+5">
        <svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg><span>设置</span><kbd aria-hidden="true">⌘5</kbd>
      </button>
    </div>
  </aside>
  <main>
    <header class="window-toolbar">
      <button type="button" id="sidebar-toggle" class="icon-button" aria-label="收起侧栏" title="收起侧栏" aria-expanded="true" aria-controls="sidebar">
        <svg class="icon" aria-hidden="true"><use href="#icon-sidebar"/></svg>
      </button>
      <div class="breadcrumb">
        <svg class="icon workspace-icon" aria-hidden="true"><use href="#icon-folder"/></svg>
        <span id="workspace-name"></span><span class="crumb-divider" aria-hidden="true">/</span>
        <h1 id="title">对话</h1>
      </div>
      <div id="actions"></div>
    </header>
    <div id="notice" role="status" aria-atomic="true" hidden></div>
    <section id="content" aria-labelledby="title"></section>
  </main>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-copy">
    <form method="dialog">
      <h2 id="dialog-title"></h2><p id="dialog-copy"></p>
      <div class="action-row">
        <button value="cancel" autofocus>取消</button>
        <button value="confirm" class="primary" id="dialog-yes">确认</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="../lib/renderer.js"></script>
</body>
</html>
